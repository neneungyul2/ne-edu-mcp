[project]
name = "ne-edu-mcp"
version = "0.2.0"
description = "NEIS 교육정보 개방 포털 MCP server: 학원·교습소 정보 조회와 엑셀/CSV 내보내기"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.scripts]
ne-edu-mcp = "ne_edu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ne_edu_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real NEIS Open API (set NEIS_LIVE_TEST=1)"]
